name: Adoption

# Appends one row of public counters to ADOPTION.md on the first day of each month.
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adoption
  cancel-in-progress: false

jobs:
  record:
    name: Record the monthly counters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read the counters and add a row
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          today=$(date -u +%Y-%m-%d)
          if grep -q "^| ${today} |" ADOPTION.md; then
            echo "ADOPTION.md already has a row for ${today}"
            exit 0
          fi

          stars=$(gh api "repos/${REPO}" --jq '.stargazers_count')
          forks=$(gh api "repos/${REPO}" --jq '.forks_count')
          watchers=$(gh api "repos/${REPO}" --jq '.subscribers_count')
          contributors=$(gh api --paginate "repos/${REPO}/contributors?per_page=100" --jq '.[].login' | wc -l | tr -d ' ')
          issues=$(gh api -X GET search/issues -f q="repo:${REPO} is:issue -author:${OWNER}" --jq '.total_count')
          pulls=$(gh api -X GET search/issues -f q="repo:${REPO} is:pr -author:${OWNER}" --jq '.total_count')
          releases=$(gh api --paginate "repos/${REPO}/releases?per_page=100" --jq '.[].id' | wc -l | tr -d ' ')
          if [ "${releases}" -gt 0 ]; then
            downloads=$(gh api --paginate "repos/${REPO}/releases?per_page=100" --jq '.[].assets[].download_count' | awk '{s += $1} END {print s + 0}')
          else
            downloads="n/a"
          fi
          views=$(gh api "repos/${REPO}/traffic/views" --jq '"\(.count) (\(.uniques) unique)"' 2>/dev/null || echo "n/a")
          clones=$(gh api "repos/${REPO}/traffic/clones" --jq '"\(.count) (\(.uniques) unique)"' 2>/dev/null || echo "n/a")

          row="| ${today} | ${stars} | ${forks} | ${watchers} | ${contributors} | ${issues} | ${pulls} | ${releases} | ${downloads} | ${views} | ${clones} |"
          echo "${row}"
          ROW="${row}" python3 - <<'PY'
          import os
          path = 'ADOPTION.md'
          lines = open(path, encoding='utf-8').read().split('\n')
          # The marker comment sits right above the table; rows go under its header and separator
          at = next((i for i, l in enumerate(lines) if l.startswith('<!-- adoption:rows')), None)
          if at is None or not lines[at + 2].startswith('| ---'):
              raise SystemExit('ADOPTION.md has no adoption:rows marker above the table')
          lines.insert(at + 3, os.environ['ROW'])
          open(path, 'w', encoding='utf-8').write('\n'.join(lines))
          PY

      - name: Commit the new row
        run: |
          set -euo pipefail
          if git diff --quiet -- ADOPTION.md; then
            echo "No change"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ADOPTION.md
          git commit -m 'Record the monthly adoption counters'
          git push origin HEAD:main
