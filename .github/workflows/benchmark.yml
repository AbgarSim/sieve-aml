name: Benchmark

# On demand: fetches every list live, then measures memory, latency, throughput and matching
# accuracy in process (sieve-benchmark `real`), and HTTP throughput against the Vert.x server
# loaded with every list (sieve-benchmark `http`). Results go to the run summary and an artifact;
# docs/performance/benchmarks.rst records the published runs.

on:
  workflow_dispatch:
    inputs:
      exclude:
        description: 'Comma-separated list sources to leave out of the in-process run'
        required: false
        default: 'UA_NSDC'

permissions:
  contents: read

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  real:
    name: Real lists, in process
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B -ntp -q package -pl sieve-benchmark,sieve-cli -am -DskipTests
      - name: Install Chromium for Playwright-based providers (IL, TR)
        run: java -cp "sieve-cli/target/lib/*" com.microsoft.playwright.CLI install --with-deps chromium
      - name: Describe the runner
        run: |
          {
            echo '### Runner'
            echo
            echo '```'
            lscpu | grep -E '^(Model name|CPU\(s\)|Thread|Core)'
            free -g | head -2
            echo '```'
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fetch every list and measure
        env:
          EXCLUDE: ${{ github.event.inputs.exclude || 'UA_NSDC' }}
        run: |
          mkdir -p benchmark-report
          java -Xmx10g -jar sieve-benchmark/target/sieve-benchmark-0.1.0-SNAPSHOT.jar \
            real --exclude "$EXCLUDE" --out benchmark-report 2> benchmark-report/stderr.txt
          cat benchmark-report/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-real
          path: benchmark-report/
          retention-days: 30

  http:
    name: Vert.x server over HTTP
    needs: real
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B -ntp -q package -pl sieve-benchmark,sieve-server,sieve-cli -am -DskipTests
      - name: Install Chromium for Playwright-based providers (IL, TR)
        run: java -cp "sieve-cli/target/lib/*" com.microsoft.playwright.CLI install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-real
          path: benchmark-report
      - name: Start the server and wait until every list is loaded
        run: |
          START=$(date +%s)
          nohup java -Xmx10g -jar sieve-server/target/sieve-server-0.1.0-SNAPSHOT.jar > server-out.txt 2>&1 &
          echo $! > server.pid
          until grep -q 'Ingestion complete' server-out.txt; do
            if ! kill -0 "$(cat server.pid)" 2> /dev/null; then tail -50 server-out.txt; exit 1; fi
            sleep 10
          done
          echo "Server loaded every list in $(( $(date +%s) - START )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          grep 'Ingestion complete' server-out.txt | tee -a "$GITHUB_STEP_SUMMARY"
          curl -s http://localhost:8080/api/v1/health | jq -c '.index.totalEntities'
      - name: HTTP load test
        run: |
          java -jar sieve-benchmark/target/sieve-benchmark-0.1.0-SNAPSHOT.jar \
            http --url http://localhost:8080/api/v1/screen --names benchmark-report/names.txt \
            2> http-stderr.txt | tee http-report.md
          cat http-report.md >> "$GITHUB_STEP_SUMMARY"
          echo "Server resident memory: $(ps -o rss= -p "$(cat server.pid)" | awk '{printf "%d MB", $1/1024}')" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-http
          path: |
            http-report.md
            http-stderr.txt
            server-out.txt
          retention-days: 30
