name: Dashboard

# Nightly: fetches every sanctions list, writes the snapshot data files, builds the
# dashboard in dashboard/, records the demo from the result (a browser walkthrough with
# video and screenshots, REST calls against the Vert.x server, one CLI screening) and
# publishes everything to GitHub Pages. History and last night's demo are carried over
# from the published site, so trends grow by one row per night and a failed recording
# keeps the previous demo.
#
# Requires Settings > Pages > Source: GitHub Actions.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Comma-separated list sources to fetch (empty for all). A partial run is not published.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build CLI
        run: mvn -B -ntp -q package -pl sieve-cli -am -DskipTests
      - name: Install Chromium for Playwright-based providers (IL, TR)
        run: java -cp "sieve-cli/target/lib/*" com.microsoft.playwright.CLI install --with-deps chromium
      - name: Restore history from the published site
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          mkdir -p snapshot
          curl -fsSL "https://${OWNER,,}.github.io/${REPO}/data/history.json" -o snapshot/history.json \
            || { echo "No published history yet"; rm -f snapshot/history.json; }
          # When each record was first seen and last changed
          curl -fsSL "https://${OWNER,,}.github.io/${REPO}/data/seen.json" -o snapshot/seen.json \
            || { echo "No published record history yet"; rm -f snapshot/seen.json; }
          # News mentions of published names from earlier nights
          curl -fsSL "https://${OWNER,,}.github.io/${REPO}/data/news.json" -o snapshot/news.json \
            || { echo "No published news mentions yet"; rm -f snapshot/news.json; }
      - name: Fetch lists and write snapshot
        env:
          SIEVE_NSDC_API_KEY: ${{ secrets.SIEVE_NSDC_API_KEY }}
          SOURCES: ${{ github.event.inputs.sources }}
        run: |
          ARGS=(snapshot --out snapshot)
          if [ -n "$SOURCES" ]; then ARGS+=(--source "$SOURCES"); fi
          java -jar sieve-cli/target/sieve-cli-0.1.0-SNAPSHOT.jar "${ARGS[@]}"
      - name: Summarize
        if: always()
        run: |
          if [ -f snapshot/sources.json ]; then
            {
              echo '| Source | Status | Entities | Fetch ms |'
              echo '| --- | --- | ---: | ---: |'
              jq -r '.sources[] | "| \(.source) | \(.status) | \(.entities // 0) | \(.fetchMs // "") |"' snapshot/sources.json
            } >> "$GITHUB_STEP_SUMMARY"
            du -sh snapshot/*.json snapshot/entities
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-snapshot
          path: snapshot/
          retention-days: 14

  build:
    needs: snapshot
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build site
        working-directory: dashboard
        run: |
          npm ci
          npm run build
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-snapshot
          path: dashboard/dist/data
      # The published demo is part of the site, so a night whose recording fails, or whose
      # demo job fails outright, still publishes last night's demo. Kept whole or not at all.
      - name: Keep last night's demo
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          BASE="https://${OWNER,,}.github.io/${REPO}/demo"
          DEMO=dashboard/dist/demo
          mkdir -p "$DEMO"
          if curl -fsSL "$BASE/manifest.json" -o "$DEMO/manifest.json"; then
            for f in $(jq -r '.files[]' "$DEMO/manifest.json"); do
              case "$f" in manifest.json|*/*|.*) continue;; esac
              if ! curl -fsSL "$BASE/$f" -o "$DEMO/$f"; then
                echo "Could not keep $f, so the previous demo is not carried over"
                rm -rf "$DEMO"
                break
              fi
            done
            [ -d "$DEMO" ] && echo "Kept the demo of $(jq -r .generatedAt "$DEMO/manifest.json")"
          else
            echo "No published demo yet"
            rm -rf "$DEMO"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-site
          path: dashboard/dist
          retention-days: 7
      # Published as it is if the demo job cannot add tonight's demo to it
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  # Records the demo from the site as built tonight (dashboard/demo/record.mjs) and uploads the
  # site again with it. A failed recording does not fail the night: the site is published either
  # way, with last night's demo when tonight's could not be recorded. A partial run (sources set)
  # records too, which is how a change to the recorder is tried on real data, but publishes nothing.
  demo:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Two Playwrights share ~/.cache/ms-playwright: the recorder's and the one the IL and TR
      # providers use. Without this, whichever installs second removes the other's Chromium.
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the server and the CLI
        run: mvn -B -ntp -q package -pl sieve-server,sieve-cli -am -DskipTests
      - name: Install the recorder, its browser and ffmpeg
        working-directory: dashboard
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Install Chromium for Playwright-based providers (IL, TR)
        run: java -cp "sieve-cli/target/lib/*" com.microsoft.playwright.CLI install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-site
          path: dashboard/dist
      - name: Start the Vert.x server with every list, and serve the site
        run: |
          nohup java -Xmx8g -jar sieve-server/target/sieve-server-0.1.0-SNAPSHOT.jar > server-out.txt 2>&1 &
          echo $! > server.pid
          nohup python3 -m http.server 4173 --directory dashboard/dist > site-out.txt 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:4173/ > /dev/null && break; sleep 1; done
          curl -fs http://localhost:4173/ > /dev/null || { cat site-out.txt; exit 1; }
      # The REST calls are recorded once every list is in, so that the demo shows the server as
      # it serves, not as it loads. Loading takes about five minutes.
      - name: Wait for the server to load every list
        run: |
          for i in $(seq 1 90); do
            grep -q 'Ingestion complete' server-out.txt && break
            if ! kill -0 "$(cat server.pid)" 2> /dev/null; then
              echo "The server stopped while loading; the REST calls will not be recorded." | tee -a "$GITHUB_STEP_SUMMARY"
              tail -40 server-out.txt
              break
            fi
            sleep 10
          done
          grep 'Ingestion complete\|Provider failed' server-out.txt || echo "Still loading after 15 minutes"
      - name: Record the demo
        id: record
        continue-on-error: true
        working-directory: dashboard
        env:
          SIEVE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          node demo/record.mjs --site http://localhost:4173/ --api http://localhost:8080 \
            --cli ../sieve-cli/target/sieve-cli-0.1.0-SNAPSHOT.jar --out dist/demo \
            --api-timeout 120 --commit "${{ github.sha }}"
      - name: Server log
        if: steps.record.outcome == 'failure'
        run: |
          echo "The recording failed; the site is published with the previous demo, if any." | tee -a "$GITHUB_STEP_SUMMARY"
          tail -60 server-out.txt
      - name: Stop the server
        if: always()
        run: kill "$(cat server.pid)" 2> /dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-demo
          path: dashboard/dist/demo
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-with-demo
          path: dashboard/dist

  deploy:
    needs: [build, demo]
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event.inputs.sources == '' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.demo.result == 'success' && 'github-pages-with-demo' || 'github-pages' }}
