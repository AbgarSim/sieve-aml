name: Dashboard

# Nightly: fetches every sanctions list, writes the snapshot data files, builds the
# dashboard in dashboard/ and publishes both to GitHub Pages. History is carried over
# from the published site, so trends grow by one row per night.
#
# Requires Settings > Pages > Source: GitHub Actions.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Comma-separated list sources to fetch (empty for all). A partial run is not published.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build CLI
        run: mvn -B -ntp -q package -pl sieve-cli -am -DskipTests
      - name: Install Chromium for Playwright-based providers (IL, TR)
        run: java -cp "sieve-cli/target/lib/*" com.microsoft.playwright.CLI install --with-deps chromium
      - name: Restore history from the published site
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          mkdir -p snapshot
          curl -fsSL "https://${OWNER,,}.github.io/${REPO}/data/history.json" -o snapshot/history.json \
            || { echo "No published history yet"; rm -f snapshot/history.json; }
      - name: Fetch lists and write snapshot
        env:
          SIEVE_NSDC_API_KEY: ${{ secrets.SIEVE_NSDC_API_KEY }}
          SOURCES: ${{ github.event.inputs.sources }}
          TEMP_COMPARE: '1'
        run: |
          ARGS=(snapshot --out snapshot)
          if [ -n "$SOURCES" ]; then ARGS+=(--source "$SOURCES"); fi
          java -jar sieve-cli/target/sieve-cli-0.1.0-SNAPSHOT.jar "${ARGS[@]}"
      - name: TEMP normalisation report
        run: |
          python3 - <<'PYEOF'
          import collections, json, random
          def load(d):
              return json.load(open(d + '/search-index.json'))['entries'], json.load(open(d + '/overview.json'))
          new_ix, new_ov = load('snapshot')
          old_ix, old_ov = load('snapshot-mode1')
          nol_ix, nol_ov = load('snapshot-mode2')
          print('DEDUP new', new_ov.get('dedup'))
          print('DEDUP main', old_ov.get('dedup'))
          print('DEDUP new-keep-legal-forms', nol_ov.get('dedup'))
          assert [e['k'] for e in new_ix] == [e['k'] for e in old_ix] == [e['k'] for e in nol_ix]
          N = len(new_ix)
          print('records', N, 'distinct keys', len({e['k'] for e in new_ix}))
          def gmap(ix):
              first = {}
              out = []
              for i, e in enumerate(ix):
                  out.append(e.get('g', 'self:%d' % i))
              return out
          G = {'new': gmap(new_ix), 'main': gmap(old_ix), 'keep': gmap(nol_ix)}
          def nonlatin(s):
              return any(ord(c) > 0x24F and c.isalpha() for c in s)
          def fmt(i):
              e = new_ix[i]
              al = e.get('a', [])
              return f"{e['s']}:{e['t']}:{e['n']}" + (f" [{'; '.join(al[:3])}{'...' if len(al) > 3 else ''}]" if al else '')
          def diff(a, b, title, n):
              ga = collections.defaultdict(list)
              for i, g in enumerate(G[a]):
                  ga[g].append(i)
              rows = []
              for ks in ga.values():
                  parts = collections.defaultdict(list)
                  for i in ks:
                      parts[G[b][i]].append(i)
                  if len(parts) > 1:
                      rows.append(list(parts.values()))
              script = [r for r in rows if any(nonlatin(new_ix[i]['n'] + ''.join(new_ix[i].get('a', []))) for p in r for i in p)]
              org = [r for r in rows if all(new_ix[i]['t'] in 'ECO' for p in r for i in p)]
              print('==', title, len(rows), 'non-Latin', len(script), 'organisations', len(org))
              random.seed(7)
              for label, rs in (('SCRIPT', script), ('ORG', org), ('OTHER', [r for r in rows if r not in script and r not in org])):
                  print('  --', label)
                  for r in random.sample(rs, min(n, len(rs))):
                      print('   ', ' || '.join(' | '.join(fmt(i) for i in p) for p in r)[:420])
          diff('new', 'main', 'MERGED BY NEW, APART ON MAIN', 14)
          diff('main', 'new', 'APART IN NEW, MERGED ON MAIN', 14)
          diff('new', 'keep', 'MERGED ONLY BECAUSE LEGAL FORMS ARE STRIPPED', 20)
          diff('keep', 'new', 'SPLIT ONLY BECAUSE LEGAL FORMS ARE STRIPPED', 20)
          PYEOF
      - name: Summarize
        if: always()
        run: |
          if [ -f snapshot/sources.json ]; then
            {
              echo '| Source | Status | Entities | Fetch ms |'
              echo '| --- | --- | ---: | ---: |'
              jq -r '.sources[] | "| \(.source) | \(.status) | \(.entities // 0) | \(.fetchMs // "") |"' snapshot/sources.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-snapshot
          path: snapshot/
          retention-days: 14

  build:
    needs: snapshot
    if: github.event.inputs.sources == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build site
        working-directory: dashboard
        run: |
          npm ci
          npm run build
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-snapshot
          path: dashboard/dist/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
