name: Dashboard

# Nightly: fetches every sanctions list, writes the snapshot data files, builds the
# dashboard in dashboard/ and publishes it to GitHub Pages. History is carried over from
# the published site (or, if it can't be reached, from the last published run's snapshot
# artifact), so trends grow by one row per night. The demo recording is not part
# of the site: it lives in docs/demo/ and is refreshed by the Demo workflow.
#
# Requires Settings > Pages > Source: GitHub Actions.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Comma-separated list sources to fetch (empty for all). A partial run is not published.'
        required: false
        default: ''

permissions:
  contents: read
  # Reads the breach reports accepted on issues
  issues: read
  # Falls back to the last published run's snapshot when the site can't be reached
  actions: read

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build CLI
        run: mvn -B -ntp -q package -pl sieve-cli -am -DskipTests
      - name: Install Chromium for Playwright-based providers (IL, TR)
        run: java -cp "sieve-cli/target/lib/*" com.microsoft.playwright.CLI install --with-deps chromium
      - name: Restore history from the published site
        env:
          SITE: https://sieveaml.org
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p snapshot
          FILES=(
            history.json      # one row per night of totals
            seen.json         # when each record was first seen and last changed
            changes.json      # the records that appeared, left or changed on earlier nights
            news.json         # news mentions of published names from earlier nights
            enforcement.json  # sanctions enforcement actions, so that only new notices are read
          )
          fetch_site() {
            for f in "${FILES[@]}"; do
              curl -fsSL --retry 3 --retry-delay 10 --retry-all-errors "$SITE/data/$f" -o "snapshot/$f" || return 1
            done
          }
          # The snapshot artifact of the newest run that was deployed holds the same files
          fetch_artifact() {
            for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/dashboard.yml/runs?status=success&per_page=20" --jq '.workflow_runs[].id'); do
              deployed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '.jobs[] | select(.name == "deploy") | .conclusion')
              [ "$deployed" = success ] || continue
              echo "Restoring from the snapshot of run $id"
              gh run download "$id" -R "$GITHUB_REPOSITORY" -n dashboard-snapshot -D prev || return 1
              for f in "${FILES[@]}"; do cp "prev/$f" "snapshot/$f" || return 1; done
              rm -rf prev
              return 0
            done
            return 1
          }
          # The site has been published since October 2026, so a missing file means the fetch
          # failed. Stop rather than start the history over and publish a site that has lost it.
          fetch_site || { echo "::warning::Could not restore history from $SITE, trying the last published snapshot"; fetch_artifact; } \
            || { echo "::error::Could not restore history from $SITE or from a published snapshot"; exit 1; }
      - name: Fetch lists and write snapshot
        env:
          SIEVE_NSDC_API_KEY: ${{ secrets.SIEVE_NSDC_API_KEY }}
          SOURCES: ${{ github.event.inputs.sources }}
        run: |
          ARGS=(snapshot --out snapshot)
          if [ -n "$SOURCES" ]; then ARGS+=(--source "$SOURCES"); fi
          java -jar sieve-cli/target/sieve-cli-0.1.0-SNAPSHOT.jar "${ARGS[@]}"
      - name: Summarize
        if: always()
        run: |
          if [ -f snapshot/sources.json ]; then
            {
              echo '| Source | Status | Entities | Fetch ms |'
              echo '| --- | --- | ---: | ---: |'
              jq -r '.sources[] | "| \(.source) | \(.status) | \(.entities // 0) | \(.fetchMs // "") |"' snapshot/sources.json
            } >> "$GITHUB_STEP_SUMMARY"
            du -sh snapshot/*.json snapshot/entities
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-snapshot
          path: snapshot/
          retention-days: 14

  build:
    needs: snapshot
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build site
        working-directory: dashboard
        run: |
          npm ci
          npm run build
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-snapshot
          path: dashboard/dist/data
      - name: Collect accepted breach reports
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node dashboard/scripts/breach-reports.mjs collect dashboard/dist/data/reports.json || echo "Breach reports not collected"
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-site
          path: dashboard/dist
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event.inputs.sources == '' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
