name: Dashboard

# Nightly: fetches every sanctions list, writes the snapshot data files, builds the
# dashboard in dashboard/ and publishes both to GitHub Pages. History is carried over
# from the published site, so trends grow by one row per night.
#
# Requires Settings > Pages > Source: GitHub Actions.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Comma-separated list sources to fetch (empty for all). A partial run is not published.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  probe:
    if: github.event.inputs.sources != ''
    runs-on: ubuntu-latest
    steps:
      - name: Probe sources
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) sieve'
          B=https://sankcijas.fid.gov.lv
          echo '--- open data portal'
          curl -sSL -A "$UA" 'https://data.gov.lv/dati/api/3/action/package_search?q=sankciju&rows=10' -o ckan.json || true
          jq -r '.result.results[] | "PKG \(.name) | \(.title) | \(.metadata_modified)", (.resources[] | "  RES \(.format) \(.url) \(.last_modified // "")")' ckan.json || head -c 2000 ckan.json
          echo '--- xlsx'
          curl -sSL -A "$UA" -o subj.xlsx "$B/lv/iesaldetie-aktivi/iesaldetie-aktivi-download/sankciju-subjektu-dati"
          pip install -q openpyxl >/dev/null 2>&1 || true
          python3 - <<'PY' || true
          import openpyxl
          wb = openpyxl.load_workbook('subj.xlsx', read_only=True)
          for ws in wb.worksheets:
              print('== sheet', ws.title)
              for i, row in enumerate(ws.iter_rows(values_only=True)):
                  if i < 14 or i % 40 == 0: print(i, row)
              print('rows', i)
          PY
          echo '--- search page'
          curl -sSL -A "$UA" "$B/lv/meklet-sankciju-sarakstos" -o s.html
          grep -oiE '(action|src|href|data-[a-z-]+)="[^"]*"' s.html | grep -viE 'img/|css|cookiebot|gtag|/lv/(faq|kontakti|aktualitates|noderigi|vadlinijas|cookie|privat|pieklust)' | sort -u
          python3 -c "import re,html;t=open('s.html',encoding='utf-8').read();t=re.sub(r'(?s)<(script|style)[^>]*>.*?</(script|style)>','',t);t=re.sub(r'<[^>]+>',' ',t);t=re.sub(r'[ \t\r\n]+',' ',html.unescape(t));i=t.find('Sākums');print(t[i:i+2500])"
          grep -n -iE 'ajax|fetch\(|\$\.(get|post)|url:' s.html | head -20
          echo '--- CA aliases and entity samples'
          curl -sSL 'https://www.international.gc.ca/world-monde/assets/office_docs/international_relations-relations_internationales/sanctions/sema-lmes.xml' -o ca.xml
          grep -m 25 'Aliases-Alias' ca.xml || true
          grep -m 15 'EntityOrShip' ca.xml || true
          grep -m 10 'TitleOrShipType' ca.xml || true
          grep -m 5 'ShipIMONumber' ca.xml || true
          grep -o '<DateOfBirthOrShipBuildDate[^>]*>[^<]*' ca.xml | sed 's/.*>//' | awk '{print length($0)}' | sort | uniq -c
          grep -o '<Country-Pays>[^<]*' ca.xml | sort | uniq -c | sort -rn | head -30
          grep -o '<Schedule-Annexe>[^<]*' ca.xml | sort | uniq -c | sort -rn | head -15

  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build CLI
        run: mvn -B -ntp -q package -pl sieve-cli -am -DskipTests
      - name: Install Chromium for Playwright-based providers (IL, TR)
        run: java -cp "sieve-cli/target/lib/*" com.microsoft.playwright.CLI install --with-deps chromium
      - name: Restore history from the published site
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          mkdir -p snapshot
          curl -fsSL "https://${OWNER,,}.github.io/${REPO}/data/history.json" -o snapshot/history.json \
            || { echo "No published history yet"; rm -f snapshot/history.json; }
      - name: Fetch lists and write snapshot
        env:
          SIEVE_NSDC_API_KEY: ${{ secrets.SIEVE_NSDC_API_KEY }}
          SOURCES: ${{ github.event.inputs.sources }}
        run: |
          ARGS=(snapshot --out snapshot)
          if [ -n "$SOURCES" ]; then ARGS+=(--source "$SOURCES"); fi
          java -jar sieve-cli/target/sieve-cli-0.1.0-SNAPSHOT.jar "${ARGS[@]}"
      - name: Summarize
        if: always()
        run: |
          if [ -f snapshot/sources.json ]; then
            {
              echo '| Source | Status | Entities | Fetch ms |'
              echo '| --- | --- | ---: | ---: |'
              jq -r '.sources[] | "| \(.source) | \(.status) | \(.entities // 0) | \(.fetchMs // "") |"' snapshot/sources.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-snapshot
          path: snapshot/
          retention-days: 14

  build:
    needs: snapshot
    if: github.event.inputs.sources == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build site
        working-directory: dashboard
        run: |
          npm ci
          npm run build
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-snapshot
          path: dashboard/dist/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
