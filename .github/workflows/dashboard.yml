name: Dashboard

# Nightly: fetches every sanctions list, writes the snapshot data files, builds the
# dashboard in dashboard/ and publishes both to GitHub Pages. History is carried over
# from the published site, so trends grow by one row per night.
#
# Requires Settings > Pages > Source: GitHub Actions.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Comma-separated list sources to fetch (empty for all). A partial run is not published.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build CLI
        run: mvn -B -ntp -q package -pl sieve-cli -am -DskipTests
      - name: Install Chromium for Playwright-based providers (IL, TR)
        run: java -cp "sieve-cli/target/lib/*" com.microsoft.playwright.CLI install --with-deps chromium
      - name: Restore history from the published site
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          mkdir -p snapshot
          curl -fsSL "https://${OWNER,,}.github.io/${REPO}/data/history.json" -o snapshot/history.json \
            || { echo "No published history yet"; rm -f snapshot/history.json; }
      - name: Fetch lists and write snapshot
        env:
          SIEVE_NSDC_API_KEY: ${{ secrets.SIEVE_NSDC_API_KEY }}
          SOURCES: ${{ github.event.inputs.sources }}
        run: |
          ARGS=(snapshot --out snapshot)
          if [ -n "$SOURCES" ]; then ARGS+=(--source "$SOURCES"); fi
          java -jar sieve-cli/target/sieve-cli-0.1.0-SNAPSHOT.jar "${ARGS[@]}"
      - name: TEMP dedup report
        if: always()
        run: |
          python3 - <<'PYEOF'
          import collections
          import json
          import random
          import re
          import unicodedata

          ix = json.load(open('snapshot/search-index.json'))['entries']
          ov = json.load(open('snapshot/overview.json'))
          src = json.load(open('snapshot/sources.json'))['sources']
          print('DEDUP', ov.get('dedup'))
          groups = collections.defaultdict(list)
          for e in ix:
              if 'g' in e:
                  groups[e['g']].append(e)
          print('entries', len(ix), 'grouped', sum(len(v) for v in groups.values()), 'groups', len(groups))
          print('sizes', sorted(collections.Counter(len(v) for v in groups.values()).items()))
          print('types', sorted(collections.Counter(v[0]['t'] for v in groups.values()).items()))
          print('onOtherLists', [(s['source'], s.get('published'), s.get('onOtherLists')) for s in src if s.get('onOtherLists')])


          def fmt(e):
              return f"{e['s']}:{e['n']}" + (f" (+{len(e.get('a', []))} aka)" if e.get('a') else '')


          def show(title, gs, limit=200):
              print('==', title, len(gs))
              for g in gs[:limit]:
                  print(' | '.join(fmt(e) for e in g))


          def norm(s):
              s = unicodedata.normalize('NFKD', s).encode('ascii', 'ignore').decode()
              return set(t for t in re.sub(r'[^a-z0-9\s]', ' ', s.lower()).split() if len(t) > 1)


          def toks(e):
              out = norm(e['n'])
              for a in e.get('a', []):
                  out |= norm(a)
              return out


          big = sorted(groups.values(), key=len, reverse=True)[:15]
          show('LARGEST', big)
          putin = [g for g in groups.values() if any('putin' in e['n'].lower() or 'poutine' in e['n'].lower() for e in g)]
          show('PUTIN', putin)
          print('== PUTIN UNGROUPED')
          for e in ix:
              if 'g' not in e and ('putin' in e['n'].lower() or 'poutine' in e['n'].lower() or any('putin' in a.lower() for a in e.get('a', []))):
                  print(fmt(e))
          random.seed(1)
          show('SAMPLE', random.sample(list(groups.values()), min(90, len(groups))))
          # Members whose names share no token with the group's lead: candidates for false merges
          sus = []
          for g in groups.values():
              lead = toks(g[0])
              for e in g[1:]:
                  if not (toks(e) & lead):
                      sus.append(g)
                      break
          show('NO SHARED TOKEN', sus, 60)
          PYEOF
      - name: Summarize
        if: always()
        run: |
          if [ -f snapshot/sources.json ]; then
            {
              echo '| Source | Status | Entities | Fetch ms |'
              echo '| --- | --- | ---: | ---: |'
              jq -r '.sources[] | "| \(.source) | \(.status) | \(.entities // 0) | \(.fetchMs // "") |"' snapshot/sources.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-snapshot
          path: snapshot/
          retention-days: 14

  build:
    needs: snapshot
    if: github.event.inputs.sources == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build site
        working-directory: dashboard
        run: |
          npm ci
          npm run build
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-snapshot
          path: dashboard/dist/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
