name: TEMP probe
on:
  push:
    branches: [claude/sanctions-breach-monitoring-ekuuag]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B -ntp -q package -pl sieve-cli -am -DskipTests
      - name: Enforcement with HMRC and BIS
        run: |
          J=sieve-cli/target/sieve-cli-0.1.0-SNAPSHOT.jar
          start=$(date +%s)
          timeout -k 20 -s QUIT 900 java -jar $J snapshot --source LV_FIU --no-wikidata --out snap > run1.log 2>&1 || echo "exit $?"
          echo "run $(( $(date +%s) - start )) s"
          grep -v DEBUG run1.log | grep -i "Enforcement source\|HMRC\|BIS\|FAILED\|Exception" | head -40
          python3 - <<'PY'
          import json, collections as C
          d=json.load(open('snap/enforcement.json'))
          for s in d['sources']: print(s['id'],s['status'],s['actions'],s.get('fetchMs'),s.get('error'))
          A=d['actions']; print('actions',len(A))
          for s in ('HMRC','BIS'):
            xs=[a for a in A if a['source']==s]
            print(s,len(xs),'kinds',C.Counter(a['kind'] for a in xs),'with targets',sum(1 for a in xs if a['targets']),'with amount',sum(1 for a in xs if a.get('amount')),'range',xs[-1]['date'] if xs else '',xs[0]['date'] if xs else '')
            print(' targets',C.Counter(c for a in xs for c in a['targets']).most_common(12))
            print(' ids dup',[k for k,v in C.Counter(a['id'] for a in xs).items() if v>1])
            for a in xs[:400]: print(' ',a['date'],a['kind'][:5],a.get('party'),a.get('amount'),a['programs'],(a.get('summary') or '')[:110])
          PY
