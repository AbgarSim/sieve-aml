name: TEMP probe relations
on:
  push:
    branches: [claude/tmp-graph-probe-479a9e]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: SECO relation context
        run: |
          for i in 1 2 3; do curl -fsSL --retry 3 -o seco.xml "https://www.sesam.search.admin.ch/sesam-search-web/pages/downloadXmlGesamtliste.xhtml?lang=en&action=downloadXmlGesamtlisteAction" && break; done
          python3 - <<'PY'
          import re
          s=open('seco.xml',encoding='utf-8').read()
          idx=[m.start() for m in re.finditer('<relation ',s)]
          for i in idx[:1]+idx[700:701]+idx[1500:1501]:
              print('BEFORE:', s[i-400:i].replace('\n',' '))
              print('AT:', s[i:i+400].replace('\n',' '))
              print('---')
          inner=re.findall(r'<relation [^>]*>(.*?)</relation>',s)
          from collections import Counter
          print('children:', Counter(re.sub(r'>[^<]*<','><',x)[:80] for x in inner).most_common(5))
          rem=Counter(re.sub(r'<[^>]+>','',x).strip()[:60] for x in inner)
          print('texts:', rem.most_common(25))
          PY
