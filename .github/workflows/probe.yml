name: TEMP probe
on:
  push:
    branches: [claude/sanctions-breach-monitoring-ekuuag]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B -ntp -q package -pl sieve-cli -am -DskipTests
      - name: FinCEN penalties
        run: |
          J=sieve-cli/target/sieve-cli-0.1.0-SNAPSHOT.jar
          start=$(date +%s)
          timeout -k 20 -s QUIT 900 java -jar $J snapshot --source LV_FIU --no-wikidata --out snap > run1.log 2>&1 || echo "exit $?"
          echo "first run $(( $(date +%s) - start )) s"
          grep -v DEBUG run1.log | grep -i "enforce\|notice\|FAILED\|Exception\|written" | head -60
          grep -A12 '"main"\|"virtual\|ForkJoinPool' run1.log | head -80
          start=$(date +%s)
          ls -la snap/enforcement.json
          python3 - <<'PY'
          import json, collections as C
          d=json.load(open('snap/enforcement.json'))
          print(json.dumps(d['sources'],indent=0))
          A=d['actions']; print('actions',len(A))
          for s in ('OFAC','OFSI','FINCEN','DOJ'):
            xs=[a for a in A if a['source']==s]
            print(s,len(xs),'with targets',sum(1 for a in xs if a['targets']),'with programs',sum(1 for a in xs if a['programs']), 'range', xs[-1]['date'] if xs else '', xs[0]['date'] if xs else '')
          t=C.Counter(c for a in A for c in a['targets']); print('targets',t.most_common(30))
          p=C.Counter(c for a in A for c in a['programs']); print('programs',p.most_common(40))
          y=C.Counter((a['date'][:4],a['source']) for a in A); print('per year',sorted(y.items()))
          for s in ('OFAC','OFSI','FINCEN','DOJ'):
            for a in [a for a in A if a['source']==s][:6]: print(json.dumps(a)[:400])
          import random; random.seed(1)
          for a in random.sample([a for a in A if a['source']=='OFAC'],25): print(a['date'],a.get('party'),a.get('amount'),a['programs'])
          print('no programs OFAC sample:')
          for a in [a for a in A if a['source']=='OFAC' and not a['programs']][:25]: print(a['date'],a.get('party'),a['url'])
          S=d.get('suspected',[]); print('suspected',len(S),'with targets',sum(1 for b in S if b['targets']))
          print('suspected targets',C.Counter(c for b in S for c in b['targets']).most_common(15))
          for b in S[:30]: print(' N',b['seenAt'][:10],b['domain'],b['title'][:110],b['targets'])
          print('unread',sum(1 for a in A if a.get('unread')))
          for a in [a for a in A if a['source']=='FINCEN'][:45]: print(' F',a['date'],a.get('party'),a.get('amount'),a['programs'])
          print('DOJ no targets sample:')
          for a in [a for a in A if a['source']=='DOJ' and not a['targets']][:15]: print(a['date'],a.get('summary'))
          PY
