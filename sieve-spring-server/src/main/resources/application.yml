sieve:
  lists:
    ofac-sdn:
      enabled: true
      url: https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/SDN.XML
      refresh-cron: "0 0 2 * * *"    # 2 AM daily
    eu-consolidated:
      enabled: false
      url: https://webgate.ec.europa.eu/fsd/fsf/public/files/xmlFullSanctionsList_1_1/content?token=dG9rZW4tMjAxNw
      refresh-cron: "0 0 3 * * *"
    un-consolidated:
      enabled: false
      url: https://scsanctions.un.org/resources/xml/en/consolidated.xml
      refresh-cron: "0 0 4 * * *"
    uk-hmt:
      enabled: false
      url: https://ofsistorage.blob.core.windows.net/publishlive/2022format/ConList.xml
      refresh-cron: "0 0 5 * * *"
  screening:
    default-threshold: 0.80
    max-results: 50
  # Experimental: candidate news articles about a name, served at POST /api/v1/adverse-media and
  # never part of screening results. Off by default because it reads GDELT's public news index.
  adverse-media:
    enabled: false
    index: gkg                # gkg (local window of GDELT news files) or doc-api (GDELT search API)
    lookback-days: 90
    max-articles: 25
    backfill-hours: 6         # gkg: hours of news files read at startup
    retention-hours: 72       # gkg: how long articles are kept
    include-translated: true  # gkg: also read machine-translated non-English news
    name-threshold: 0.92      # gkg: least name similarity taken as the same name
  address:
    libpostal-enabled: false
    libpostal-data-dir: /opt/libpostal-data

spring:
  application:
    name: sieve
  # PostgreSQL is the system of record and must be reachable at startup.
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sieve}?reWriteBatchedInserts=true
    username: ${POSTGRES_USER:sieve}
    password: ${POSTGRES_PASSWORD:sieve}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080

logging:
  level:
    dev.sieve: INFO
    root: WARN
